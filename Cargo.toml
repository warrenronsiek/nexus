# @feature architecture-tooling
# @spec docs/features/architecture-tooling.md
[package]
name = "nexus"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Advisory coordination for coding agents"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
blake3 = "1.5"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
diesel = { version = "2.3", features = ["chrono", "sqlite", "returning_clauses_for_sqlite_3_35"] }
flyway = "0.7.1"
fs2 = "0.4"
libsqlite3-sys = { version = "0.38", features = ["bundled"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shell-words = "1.1"
thiserror = "2.0"
tokio = { version = "1.43", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
uuid = { version = "1.12", features = ["v4", "serde"] }
wait-timeout = "0.2"

[dev-dependencies]
tempfile = "3.15"

[profile.release]
lto = "thin"
strip = true
