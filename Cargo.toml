# @feature architecture-tooling
# @spec docs/features/architecture-tooling.md
[package]
name = "nexus"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Advisory coordination for coding agents"
license = "MIT OR Apache-2.0"

[features]
default = ["sqlite"]
sqlite = [
    "diesel/sqlite",
    "diesel/returning_clauses_for_sqlite_3_35",
    "dep:libsqlite3-sys",
]
postgres = ["diesel/postgres"]

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = "0.8"
blake3 = "1.5"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
diesel = { version = "2.3", default-features = false, features = ["chrono", "with-deprecated"] }
flyway = "0.7.1"
fs2 = "0.4"
hyper = { version = "1.12", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
libsqlite3-sys = { version = "0.38", features = ["bundled"], optional = true }
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shell-words = "1.1"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.43", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tempfile = "3.15"
toml = "0.8"
uuid = { version = "1.12", features = ["v4", "serde"] }
wait-timeout = "0.2"

[profile.release]
lto = "thin"
strip = true

[[bin]]
name = "nexus-server"
path = "src/bin/nexus-server.rs"
required-features = ["postgres"]

[[bin]]
name = "nexus-sqlite-export"
path = "src/bin/nexus-sqlite-export.rs"
required-features = ["sqlite"]
