# @feature usage-analytics
# @spec docs/features/usage-analytics.md
# @feature configuration
# @feature agent-memory
# @feature runtime
# @spec docs/features/configuration.md
# @spec docs/features/agent-memory.md
# @spec docs/features/runtime.md
schema_version = 1

# The default companion CLI and stdio MCP process use the local Unix-socket
# daemon. For a shared service, replace this section with the commented remote
# form below. Keep the bearer secret in NEXUS_SECRET or a mode-0600 file, not in
# this configuration.
[client]
transport = "local"

# [client]
# transport = "remote"
# endpoint = "https://nexus.internal.example"
# project_id = "organization/repository"
# secret_file = "/absolute/path/to/nexus-client.secret"

[coordination]
claim_ttl_seconds = 120
# In local mode the daemon reads Git directly. In remote mode the stdio MCP
# companion submits bounded changed-path evidence from the client checkout.
reconcile_seconds = 30
record_ignored_advisories = true

[privacy]
store_prompt_synopsis = true
prompt_synopsis_max_chars = 240
store_full_prompts = false

[ui]
refresh_interval_ms = 2000
recent_event_limit = 64
recent_record_limit = 100

# Semantic labels run asynchronously in the local companion using the analyst
# provider/model. Set false to retain deterministic observations only.
[analytics]
classification_enabled = true
classification_timeout_seconds = 30
max_classifications_per_day = 128

[analyst]
enabled = false
provider = "codex"
timeout_seconds = 60

[analyst.codex]
command = "codex"
# model = "your-codex-model"
reasoning_effort = "medium"

[analyst.claude]
command = "claude"
# model = "your-claude-model"

# Agents explicitly record durable notes. Nexus consolidates them in the
# background with the analyst provider and falls back to the other provider.
[memory]
enabled = true
consolidation_interval_seconds = 15
consolidation_batch_size = 8
context_max_items = 64
context_max_bytes = 16384

# Every local commit runs both review skills in parallel through a model other
# than the implementation model. Findings are advisory and never deny a commit.
[review]
enabled = true
implementation_provider = "codex"
provider = "claude"
timeout_seconds = 600
# skill_root = "/absolute/path/to/.codex/skills"

[review.codex]
command = "codex"
# model = "your-codex-review-model"
reasoning_effort = "xhigh"

[review.claude]
command = "claude"
# model = "claude-opus-5"
reasoning_effort = "xhigh"

# Uncomment to override platform-specific state paths.
# [storage]
# database_path = "/absolute/path/to/nexus.db"
#
# [runtime]
# socket_path = "/absolute/path/to/nexus.sock"
# lock_path = "/absolute/path/to/nexus.lock"
